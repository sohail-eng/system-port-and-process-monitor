# System Port & Process Monitor — Nginx site
# Installed as /etc/nginx/sites-available/default by deploy/install.sh
# Backend is loopback-only on 127.0.0.1:8009

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /var/www/html;
    index index.html;

    # Credentials live outside the web root (see install.sh).
    auth_basic "System Port & Process Monitor";
    auth_basic_user_file /etc/nginx/port-dashboard.htpasswd;

    # Static dashboard
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Live log WebSockets (long-lived)
    location /api/logs/ {
        proxy_pass http://127.0.0.1:8009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 5s;
    }

    # Proxy API to the localhost FastAPI service only
    location /api/ {
        proxy_pass http://127.0.0.1:8009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
